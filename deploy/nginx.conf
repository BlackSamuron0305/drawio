server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # The app shell must always be fresh so updates roll out; versioned assets can be cached.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|png|svg|gif|jpg|woff2?|ttf|xml)$ { add_header Cache-Control "public, max-age=86400"; }

    location / { try_files $uri $uri/ =404; }
}
